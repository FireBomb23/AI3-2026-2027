<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sugestões dos Alunos</title>
<style>
  :root { --fundo:#f6f7f9; --cartao:#fff; --texto:#1c2330; --suave:#5b6577; --linha:#d9dee7; --acento:#1f5fbf; --erro:#b3261e; color-scheme: light; }
  :root[data-tema="escuro"] { --fundo:#14181f; --cartao:#1d232d; --texto:#e8ecf2; --suave:#9aa5b8; --linha:#313a4a; --acento:#6aa4ff; --erro:#ff8a80; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--fundo); color:var(--texto); }
  main { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 3rem; display:grid; gap:1rem; }
  section { background:var(--cartao); border:1px solid var(--linha); border-radius:10px; padding:1rem 1.25rem; }
  h1 { font-size:1.5rem; margin:0 0 .25rem; } h2 { font-size:1.1rem; margin:0 0 .75rem; }
  label { display:block; margin:.6rem 0 .2rem; font-size:.9rem; color:var(--suave); }
  input, select, textarea, button { font:inherit; color:inherit; background:var(--fundo); border:1px solid var(--linha); border-radius:6px; padding:.45rem .6rem; }
  input, textarea, select { width:100%; } textarea { min-height:6rem; resize:vertical; }
  button { cursor:pointer; background:var(--acento); color:#fff; border-color:var(--acento); margin-top:.8rem; }
  button.secundario { background:transparent; color:var(--texto); border-color:var(--linha); }
  .linha { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  .erro { color:var(--erro); margin:.6rem 0 0; min-height:1.2em; }
  .topo { display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:.6rem; }
  li { border:1px solid var(--linha); border-radius:8px; padding:.6rem .8rem; }
  li small { color:var(--suave); } .estado { font-weight:600; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Sugestões dos Alunos</h1>
    <p id="a-carregar">A verificar a sessão…</p>
  </header>

  <section aria-labelledby="t-config">
    <h2 id="t-config">Configurações</h2>
    <div class="linha">
      <div>
        <label for="cfg-tema">Tema</label>
        <select id="cfg-tema"><option value="claro">Claro</option><option value="escuro">Escuro</option></select>
      </div>
      <div>
        <label for="cfg-ordenacao">Ordenação das sugestões</label>
        <select id="cfg-ordenacao"><option value="recentes">Mais recentes primeiro</option><option value="estado">Por estado</option></select>
      </div>
    </div>
  </section>

  <section id="entrada" hidden aria-labelledby="t-entrada">
    <h2 id="t-entrada">Entrar</h2>
    <form id="form-entrada">
      <label for="utilizador">Utilizador (número de aluno ou nome.apelido)</label>
      <input id="utilizador" autocomplete="username" required>
      <label for="palavraPasse">Palavra-passe</label>
      <input id="palavraPasse" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <p class="erro" id="erro-entrada" role="alert"></p>
    </form>
  </section>

  <div id="sessao" hidden style="display:grid;gap:1rem">
    <section aria-labelledby="t-sessao">
      <div class="topo">
        <div>
          <h2 id="t-sessao">Sessão</h2>
          <div id="dados-sessao"></div>
        </div>
        <button id="btn-terminar" class="secundario" type="button">Terminar sessão</button>
      </div>
    </section>

    <section id="area-nova" hidden aria-labelledby="t-nova">
      <h2 id="t-nova">Nova sugestão</h2>
      <form id="form-nova">
        <label for="titulo">Título (10 a 120 caracteres)</label>
        <input id="titulo" maxlength="120">
        <label for="categoria">Categoria</label>
        <select id="categoria"></select>
        <label for="descricao">Descrição (20 a 2000 caracteres)</label>
        <textarea id="descricao" maxlength="2000"></textarea>
        <button type="submit">Submeter</button>
        <p class="erro" id="erro-nova" role="alert"></p>
      </form>
    </section>

    <section aria-labelledby="t-lista">
      <h2 id="t-lista">Sugestões</h2>
      <ul id="lista"></ul>
      <p id="lista-vazia" hidden>Sem sugestões para mostrar.</p>
    </section>
  </div>
</main>
<script src="configuracoes.js"></script>
<script src="app.js"></script>
</body>
</html>
